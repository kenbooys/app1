name: ci

on:
  push:
    branches: [master]
    # Tag rilis `v*` → ci.yml jalan penuh lalu (kalau diaktifkan) deploy.
    # Job hilir di-force-run di event tag (lihat `startsWith(github.ref,'refs/tags/v')`
    # di tiap `if`) supaya tak bergantung perilaku paths-filter di tag.
    tags: ['v*']
    # Path filter — skip CI untuk commit yang HANYA touch docs/personal artifact.
    # Workflow tetap trigger kalau ada file lain (code, config, atau docs project).
    paths-ignore:
      - 'docs/personal/**'
      - 'docs/archive/**'
      - '**.md.bak'
  pull_request:
    # `ready_for_review` ditambah supaya CI jalan saat PR draft di-mark Ready.
    # Kombinasi dgn guard `draft == false` di job `changes` → push WIP ke draft
    # PR tidak bakar CI; CI penuh jalan saat siap di-review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - 'docs/personal/**'
      - 'docs/archive/**'
      - '**.md.bak'
  # Tombol manual "Run workflow" di tab Actions GitHub — buat QA tester
  # yang tidak punya environment lokal (WSL/Docker). Output evidence (trace +
  # screenshot + video) ter-upload sebagai artifact yang bisa di-download.
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file (opsional, contoh: auth.spec.ts). Kosong = semua curated suite.'
        required: false
        default: ''
      evidence:
        description: 'Collect full evidence per test (trace + screenshot + video setiap test, bukan only-on-failure)?'
        type: boolean
        required: false
        default: true

# Permission GITHUB_TOKEN. dorny/paths-filter butuh `pull-requests: read` untuk
# query daftar file berubah via API saat event pull_request (tanpa ini error
# "Resource not accessible by integration" di org dengan default token restricted).
# `contents: read` untuk checkout + diff. Eksplisit = minimal & aman.
permissions:
  contents: read
  pull-requests: read

# Cancel run usang saat ada push baru di ref yang sama — hemat compute saat dev
# iterate cepat di PR/branch. TAPI **jangan** batalkan run di branch default
# (master): branch deployable & protected, tiap commit wajib
# dapat run CI lengkap (bukti hijau + prasyarat gate deploy). Tanpa guard ini,
# push master kedua membatalkan run master pertama yang masih jalan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Action kunci sudah native Node 24 (checkout@v5, paths-filter@v4, setup-node@v4,
# cache@v4) → tidak ada lagi warning "Node.js 20 deprecated". Env var di bawah
# jadi safety-net kalau ada action transitif yang masih Node 20 (GitHub
# auto-force Node 24 mulai 2 Juni 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # #4 — Deteksi area yang berubah. Job hilir di-skip kalau area-nya tidak
  # tersentuh (mis. PR PHP-only → frontend lint/tsc/vitest tidak jalan).
  # NOTE branch protection: jadikan `ci-gate` SATU-SATUNYA required check —
  # job yang di-skip via `if` di-anggap "skipped" oleh GitHub & akan block
  # merge kalau di-set sebagai required langsung. `ci-gate` agregat hasilnya.
  changes:
    name: detect changes
    # Push event (master) selalu jalan; PR hanya kalau BUKAN draft → push WIP ke
    # draft PR tidak menjalankan CI. ci-gate (always-run) lulus trivial saat skip,
    # tapi draft PR memang tidak bisa di-merge GitHub, jadi aman.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon'
              - 'pint.json'
              - 'routes/**'
              - 'database/**'
              - 'config/**'
              - 'app/**'
              - 'tests/**'
              - 'resources/views/**'
              - 'resources/js/**'
              - 'resources/css/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'scripts/**'
            frontend:
              - 'resources/js/**'
              - 'resources/css/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.prettierrc*'
            e2e:
              - 'app/**'
              - 'routes/**'
              - 'database/**'
              - 'config/**'
              - 'resources/**'
              - 'tests-e2e/**'
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'

  # #3 — Vite build SEKALI, share `public/build` ke job lain via artifact.
  # Sebelumnya backend + frontend + e2e masing-masing build (3×).
  build:
    name: vite build (shared artifact)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Filament theme CSS di-import dari vendor/ oleh Vite → composer wajib
      # sebelum build (cukup --no-scripts, tidak perlu artisan discover).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install composer deps (Filament CSS imports)
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Vite build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  backend:
    name: pint + phpstan + pest + doc policy + gitleaks
    needs: [changes, build]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: hris_db_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: vsapps
      DB_VSAPPS_HOST: 127.0.0.1
      DB_VSAPPS_PORT: 3306
      DB_VSAPPS_DATABASE: hris_db_testing
      DB_VSAPPS_USERNAME: root
      DB_VSAPPS_PASSWORD: secret
      # Generic DB_* fallback untuk connections `hr`, `dashboard`, `legacy_vsapps`
      # yang dipakai migration translator tests. Tests redirect connection
      # `.database` ke `hris_db_testing` di runtime, tapi host/user/password
      # masih perlu match service MySQL.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: secret
      # APP_KEY ephemeral untuk CI — session/encryption tests perlu key valid.
      # Dummy value (32 byte base64) cukup karena tidak dipakai untuk production data.
      APP_KEY: base64:zHmJk9JQVZBhwQ2WChI+8jJpoQNqr6m6JlH1VlbBeQA=

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          CONVENTIONAL_SINCE: ${{ vars.CONVENTIONAL_SINCE }}
        run: ./scripts/validate-commit-msgs.sh origin/${{ github.base_ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer
          extensions: mbstring, pdo, pdo_mysql, intl, gd, zip, bcmath

      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      # #3 — Ambil manifest Vite dari job `build` (Pest render Inertia pages via
      # app.blade.php @vite() → butuh public/build/manifest.json). Backend tak
      # perlu node/npm lagi.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -psecret --silent; do
            echo "waiting for mysql…"
            sleep 2
          done

      - name: Pint (style check)
        run: ./vendor/bin/pint --test

      - name: Cache PHPStan result
        uses: actions/cache@v4
        with:
          path: build/phpstan
          key: phpstan-${{ hashFiles('composer.lock') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ hashFiles('composer.lock') }}-
            phpstan-

      - name: PHPStan (level 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Pest (hard test enforcement + coverage gate ≥ 65% + clover XML)
        run: ./vendor/bin/pest --parallel --coverage --coverage-clover=coverage.xml --min=65

      - name: Per-file coverage gate (catch <30% files that global avg hides)
        run: ./scripts/check-file-coverage.sh coverage.xml 30

      - name: Test-pair validator (hard mode — block on missing test/tag)
        run: ./scripts/validate-test-coverage.sh

      - name: Determine diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
          fi

      - name: Doc policy check
        run: |
          export EXPECTED_DATE=$(git log -1 --format=%cd --date=format:%Y-%m-%d HEAD)
          git diff --name-only --diff-filter=ACMR "${{ steps.diff.outputs.base }}"..HEAD \
            | ./scripts/validate-docs.sh

      - name: Gitleaks scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact --exit-code 1

  frontend:
    name: eslint + prettier + vue-tsc + vitest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Vitest (Vue smoke + useFormFeedback unit + coverage gate)
        run: npm run test:vue:coverage

  e2e:
    name: playwright e2e (no-foto suite)
    needs: [changes, build]
    # Hemat CI: e2e TIDAK jalan di push (master) — sudah lulus
    # di PR sebelum merge, jadi re-run pasca-merge cuma buang ~8-10 menit (#1).
    # Tetap jalan di pull_request (kalau area e2e berubah) + workflow_dispatch.
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')) && (needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: hris_db_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: e2e
      APP_KEY: base64:zHmJk9JQVZBhwQ2WChI+8jJpoQNqr6m6JlH1VlbBeQA=
      DB_CONNECTION: vsapps
      DB_VSAPPS_HOST: 127.0.0.1
      DB_VSAPPS_PORT: 3306
      DB_VSAPPS_DATABASE: hris_db_e2e
      DB_VSAPPS_USERNAME: root
      DB_VSAPPS_PASSWORD: secret
      # Bypass Playwright's auto-start webServer (yang pakai --env=e2e flag,
      # butuh .env.e2e file). Di CI kita pakai env vars di workflow level + start
      # server manual.
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          extensions: mbstring, pdo, pdo_mysql, intl, gd, zip, bcmath

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -psecret --silent; do
            echo "waiting for mysql…"
            sleep 2
          done

      - name: Migrate + seed E2E
        run: |
          php artisan migrate:fresh --seed --seeder=Database\\Seeders\\E2ESeeder

      # #3 — Ambil production assets dari job `build` (ganti `npm run build` lokal).
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      # #2 — Cache browser Playwright (~100-200MB). Tanpa cache, di-download tiap
      # run. Binary di-skip kalau cache hit; `--with-deps` tetap pasang lib apt.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Laravel server (background)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/login > /dev/null 2>&1; then
              echo "Laravel ready"
              break
            fi
            sleep 1
          done

      # Curated set: specs yang tidak butuh foto upload (Spaces mock infra belum
      # ada di CI). Foto-required specs (dispensasi-, lembur-, spg-toko-,
      # spg-apotek-, spg-absensi) tetap local/manual sampai infra-nya siap.
      #
      # Manual run via workflow_dispatch: input `spec` override curated list
      # (mis. QA mau test 1 spec saja). Input `evidence` aktifkan QA_EVIDENCE=1.
      - name: Run Playwright (no-foto curated suite)
        env:
          QA_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence && '1' || '' }}
        run: |
          if [ -n "${{ inputs.spec }}" ]; then
            # Manual run dengan spec spesifik dari QA
            npx playwright test --reporter=line "tests-e2e/${{ inputs.spec }}"
          else
            # Default: curated no-foto suite (push/PR + workflow_dispatch tanpa spec).
            # Order: empty-state DULU (before any submission test pollutes DB).
            # Foto-required specs (dispensasi-thank-you, lembur-thank-you, spg-toko-thank-you,
            # spg-apotek-thank-you, spg-absensi) tetap local/manual sampai Spaces mock ready.
            npx playwright test --reporter=line \
              tests-e2e/auth.spec.ts \
              tests-e2e/confirmation-dialog.spec.ts \
              tests-e2e/empty-state.spec.ts \
              tests-e2e/meeting-room.spec.ts \
              tests-e2e/mobile-only-block.spec.ts \
              tests-e2e/staff-dispensasi-gate.spec.ts \
              tests-e2e/staff-dispensasi-submit.spec.ts \
              tests-e2e/staff-cuti-flow.spec.ts \
              tests-e2e/staff-izin-flow.spec.ts \
              tests-e2e/approval-email-token.spec.ts \
              tests-e2e/approval-l2.spec.ts \
              tests-e2e/spg-cuti-thank-you.spec.ts \
              tests-e2e/spg-izin-thank-you.spec.ts \
              tests-e2e/staff-atk-thank-you.spec.ts \
              tests-e2e/staff-atk.spec.ts \
              tests-e2e/staff-cuti-submit.spec.ts \
              tests-e2e/staff-cuti-thank-you.spec.ts \
              tests-e2e/staff-izin-thank-you.spec.ts \
              tests-e2e/submission-feedback.spec.ts \
              tests-e2e/approval-l1.spec.ts
          fi

      # Upload artifact: always saat manual dispatch (QA butuh evidence walaupun pass),
      # on-failure saja saat push/PR (CI signal — gak perlu storage saat hijau).
      - name: Upload Playwright report
        if: always() && (github.event_name == 'workflow_dispatch' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test-results
        if: always() && (github.event_name == 'workflow_dispatch' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Laravel log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-log
          path: /tmp/laravel.log
          retention-days: 7

  # #4 — Gate agregat. SATU-SATUNYA job yang dijadikan required di branch
  # protection. Selalu jalan; lulus kalau tidak ada job hilir yang `failure`
  # (job yang `skipped` karena path-filter di-anggap OK).
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, build, backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results=(
            "changes:${{ needs.changes.result }}"
            "build:${{ needs.build.result }}"
            "backend:${{ needs.backend.result }}"
            "frontend:${{ needs.frontend.result }}"
            "e2e:${{ needs.e2e.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            name="${r%%:*}"; res="${r##*:}"
            echo "$name = $res"
            if [ "$res" = "failure" ]; then failed=1; fi
          done
          if [ "$failed" = "1" ]; then
            echo "::error::Salah satu job CI gagal."
            exit 1
          fi
          echo "Semua job lulus / di-skip dengan benar."

  # Fase 2 — Deploy prod via self-hosted runner di VPS. DORMAN sampai diaktifkan.
  # Detail + langkah aktivasi: docs/project/ci-deploy-self-hosted-runner.md
  #
  # Jalan HANYA kalau SEMUA benar:
  #  - event push tag rilis `v*` (bukan PR/branch) → kode PR/fork tak pernah jalan di runner prod
  #  - `ci-gate` sukses (needs: ci-gate → skip otomatis kalau gate gagal)
  #  - Variable repo `PROD_DEPLOY_ENABLED == 'true'` (saklar aktivasi — default unset → SKIP)
  # Sampai runner prod terpasang + flag di-set, job ini SELALU skip → tidak ada deploy.
  deploy:
    name: deploy via self-hosted runner (prod)
    needs: ci-gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, prod]
    # Cegah dua deploy tumpang-tindih (tidak membatalkan yang sedang jalan).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy (script lokal di VPS, tanpa SSH)
        run: |
          cd "${{ vars.PROD_APP_DIR }}"
          ./main.sh deploy "${{ github.ref_name }}"
